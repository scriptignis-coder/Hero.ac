<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeRo Shield · Discord check</title>
<link rel="icon" href="/assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070809; --card:#0e1219; --line:rgba(125,180,255,.14); --text:#e8ecff; --muted:#8a93a8; --dim:#5a6276;
          --cyan:#7dd3fc; --blue:#3b82f6; --green:#10b981; --red:#f43f5e; --discord:#5865f2; }
  * { box-sizing:border-box; margin:0 }
  body { min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:
         radial-gradient(900px 500px at 50% -10%, rgba(88,101,242,.18), transparent 60%), var(--bg);
         color:var(--text); font-family:Inter,system-ui,sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px 28px; text-align:center;
          box-shadow:0 30px 80px rgba(0,0,0,.5) }
  .logo { display:flex; align-items:center; justify-content:center; gap:10px; font-family:Sora,sans-serif; font-weight:700; font-size:18px; margin-bottom:22px }
  .logo img { width:28px; height:28px }
  .logo span { color:var(--cyan) }
  h1 { font-family:Sora,sans-serif; font-size:22px; margin-bottom:10px }
  p { color:var(--muted); font-size:14px; line-height:1.6 }
  .pin { display:inline-block; margin:16px 0 20px; font-family:ui-monospace,Consolas,monospace; letter-spacing:4px; color:var(--cyan);
         background:rgba(125,211,252,.08); border:1px solid rgba(125,211,252,.25); border-radius:10px; padding:8px 14px; font-size:16px }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:48px; border-radius:12px; border:0; cursor:pointer;
         background:var(--discord); color:#fff; font:600 15px Inter,sans-serif; text-decoration:none; transition:filter .15s }
  .btn:hover { filter:brightness(1.12) }
  .btn svg { width:22px; height:22px }
  ul { text-align:left; margin:18px 0 0; padding:14px 16px 14px 34px; border:1px solid var(--line); border-radius:12px; color:var(--muted); font-size:13px; line-height:1.8 }
  .ok { width:64px; height:64px; border-radius:50%; margin:0 auto 16px; display:grid; place-items:center; background:rgba(16,185,129,.12); color:var(--green); font-size:32px }
  .bad { background:rgba(244,63,94,.12); color:var(--red) }
  .foot { margin-top:18px; color:var(--dim); font-size:12px }

/* HeRoShield BLUE identity — user-provided magnifying glass logo */
:root{--blue:#238dff;--cyan:#65c6ff;--violet:#448cff;--green:#21c78b;--grad:linear-gradient(115deg,#75d4ff 0%,#238dff 55%,#1554e8 100%);--line:rgba(35,141,255,.15);--line-strong:rgba(35,141,255,.32)}
body{background-color:#060b19;background-image:radial-gradient(ellipse 65% 42% at 50% 0%,rgba(25,105,240,.13),transparent 75%)}
.bg-glow{background:radial-gradient(55% 40% at 50% 2%,rgba(35,141,255,.13),transparent 80%),radial-gradient(40% 30% at 100% 45%,rgba(40,85,190,.06),transparent 80%)}
.nav{background:rgba(6,12,28,.89)}
.card,.panel{background:linear-gradient(145deg,rgba(16,28,54,.97),rgba(7,15,34,.97));border-color:rgba(105,155,230,.16)}
.btn-primary{color:#061328;box-shadow:0 12px 42px rgba(35,141,255,.2)}
.btn-primary:hover{box-shadow:0 14px 48px rgba(35,141,255,.33)}
.brand{display:inline-flex;align-items:center;gap:10px}
.brand .brand-mark{width:35px;height:35px;object-fit:contain;flex:none;border-radius:50%;filter:drop-shadow(0 0 12px rgba(35,141,255,.32))}
.side-link.active{background:linear-gradient(90deg,rgba(35,141,255,.17),rgba(35,141,255,.025))!important;box-shadow:inset 3px 0 0 #238dff!important;color:#eaf4ff!important}
button:focus-visible,a:focus-visible{outline:2px solid #238dff;outline-offset:3px}
</style>
<style id="heroshield-charcoal-v18">

/* HeRoShield Charcoal Edition — presentation-only overrides */
:root{--bg:#0d1014;--bg2:#101419;--bg-2:#101419;--card:#151a20;--card2:#191f26;--card-solid:#191f26;--line:rgba(181,199,215,.105);--line2:rgba(181,199,215,.17);--line-strong:rgba(130,170,204,.23);--text:#e8edf1;--muted:#a0aab4;--dim:#697681;--blue:#739fbe;--blue2:#b1cee2;--cyan:#739fbe;--violet:#739fbe;--blueglow:rgba(115,159,190,.12);--grad:linear-gradient(135deg,#789fb9,#a4bfce);--radius:18px;--r:18px}
body{background:radial-gradient(ellipse 75% 30% at 50% -6%,rgba(115,159,190,.095),transparent 75%),#0d1014!important;color:#e8edf1}
::selection{background:rgba(115,159,190,.26)}
.bg{background:radial-gradient(780px 380px at 50% -70px,rgba(120,161,188,.13),transparent 75%),linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px) 0 0/68px 68px,linear-gradient(90deg,rgba(255,255,255,.013) 1px,transparent 1px) 0 0/68px 68px,transparent!important}
.nav.solid,header, .topbar{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav.solid{background:rgba(12,15,19,.89)!important}
.btn,.btn-w,.btn-g,.btn-b,button{transition:background .22s,border-color .22s,box-shadow .22s,transform .22s}
.btn-b{background:#739fbe!important;color:#0c141b!important}
.btn-b:hover{box-shadow:0 8px 30px rgba(115,159,190,.18)!important}
.btn-w{background:#dce5eb!important;color:#12181e!important}
.btn-g{background:rgba(210,224,234,.035)!important;border-color:rgba(210,224,234,.16)!important}
.btn-g:hover{background:rgba(115,159,190,.10)!important;border-color:rgba(115,159,190,.40)!important}
.pill{background:rgba(115,159,190,.055)!important;border-color:rgba(115,159,190,.19)!important;color:#b8c8d4!important}
.brand b{color:#93b4cb!important}
input:focus,textarea:focus,select:focus{outline-color:#739fbe!important;box-shadow:0 0 0 3px rgba(115,159,190,.12)}
:where(.card,.panel,.stat,.feature,.feature-card,.glass,.metric,.tile){border-color:rgba(190,206,219,.11)!important}
:where(.card,.panel,.feature-card,.glass){box-shadow:0 12px 38px rgba(0,0,0,.12)}
:where(.card,.panel,.feature-card,.glass):hover{border-color:rgba(135,174,200,.23)!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#101419}::-webkit-scrollbar-thumb{background:#333d47;border-radius:12px;border:2px solid #101419}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<main class="card" id="box"></main>
<script>
  const q = new URLSearchParams(location.search);
  const pin = (q.get('pin') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  const box = document.getElementById('box');
  const logo = '<div class="logo"><img src="/assets/logo.svg" alt="">HeRo <span>Shield</span></div>';
  const disc = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.6 0L8.6 3a19.5 19.5 0 0 0-4.9 1.4C.6 9.1-.3 13.6.2 18.1A19.8 19.8 0 0 0 6.2 21l1.3-2.1a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.7 19.7 0 0 0 6-3c.6-5.2-.9-9.7-3.5-13.6ZM8.5 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm7 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>';
  const ERR = { pin: 'This PIN does not exist. Ask staff for a new one.', state: 'The link expired. Click the button again.',
                token: 'Discord did not accept the login. Try again.', user: 'Could not read your Discord account. Try again.',
                server: 'Server error. Try again in a minute.',
                db: 'The site database is not up to date (missing column scan_pins.discord_check). Staff: run supabase-all.sql in Supabase → SQL Editor, then try again.',
                dbconn: 'The site cannot reach its database. Staff: check SUPABASE_URL / SUPABASE_SERVICE_KEY on Render.' };

  if (q.get('done')) {
    box.innerHTML = `${logo}<div class="ok">✓</div><h1>Discord connected</h1>
      <p>Thanks — your Discord was added to the check. You can close this page and go back to the scanner.</p>
      <div class="pin">${pin}</div>`;
  } else if (!pin) {
    box.innerHTML = `${logo}<div class="ok bad">!</div><h1>No PIN</h1><p>Open this page from the HeRo Shield scanner, or ask staff for your link.</p>`;
  } else {
    box.innerHTML = `${logo}<h1>Connect your Discord</h1>
      <p>To finish the PC check, staff ask you to connect the Discord account you play with.</p>
      <div class="pin">${pin}</div>
      ${q.get('error') ? `<p style="color:var(--red);margin-bottom:14px">${ERR[q.get('error')] || 'Something went wrong.'}</p>` : ''}
      <a class="btn" href="/api/auth/player?pin=${encodeURIComponent(pin)}">${disc} Connect Discord</a>
      <ul>
        <li>Staff see your Discord name, ID, the <b>list of servers</b> you are in and the date you joined them.</li>
        <li>No messages, no password, no friends list — Discord never gives those.</li>
        <li>It does not log you into anything or post anything.</li>
      </ul>
      <p class="foot">You can remove the access any time in Discord → Settings → Authorized Apps.</p>`;
  }
</script>
</body>
</html>
