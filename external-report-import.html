<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeRoShield | External Report Import</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f0edf9;font:15px system-ui,Arial}.wrap{max-width:720px;margin:7vh auto;padding:25px}h1{font-size:32px;letter-spacing:-.8px}p{color:#aaa8bc;line-height:1.6}.card{background:#121420;border:1px solid #303043;border-radius:18px;padding:26px}label{display:block;margin:17px 0 7px;color:#c8c6d9}input,select,textarea{width:100%;background:#0b0d17;border:1px solid #39394b;border-radius:10px;color:#fff;padding:12px;font:inherit}button{background:#e9e3ff;color:#16131d;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}a{color:#cbbaff}#msg{white-space:pre-wrap;margin-top:16px}.warn{padding:12px;border:1px solid #5b4731;border-radius:10px;color:#e6c79d;background:#231c16}</style></head><body><main class="wrap"><a href="/dashboard">← Dashboard</a><h1>External scanner report</h1><p>Admin-only import. A submitted external verdict is not independently verified by HeRoShield.</p><div class="card"><div class="warn">Use only reports you are authorized to process. Never label a manually entered Napse.ac result as an automatic integration.</div><form id="f"><label>Verified player's Discord ID</label><input name="discord_id" pattern="[0-9]{15,22}" required placeholder="Discord ID (15–22 digits)"><label>Scanner source</label><input name="source" required minlength="2" maxlength="60" placeholder="Napse.ac"><label>External verdict</label><select name="verdict"><option value="unknown">Unknown</option><option value="clean">Clean</option><option value="suspicious">Suspicious</option><option value="cheating">Cheating</option></select><label>Scan date and time (optional)</label><input type="datetime-local" name="scanned_at"><label>Evidence URL (HTTPS, optional)</label><input type="url" name="evidence_url" placeholder="https://..."><label>Notes (optional)</label><textarea name="notes" maxlength="2000" rows="4"></textarea><button type="submit">Save external report</button><div id="msg" role="status"></div></form></div></main><script>const f=document.getElementById('f'),msg=document.getElementById('msg');const q=new URLSearchParams(location.search);if(q.get('discord_id'))f.elements.discord_id.value=q.get('discord_id');f.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Saving…';const b=f.querySelector('button');b.disabled=true;try{const x=Object.fromEntries(new FormData(f));if(!x.scanned_at)delete x.scanned_at;else x.scanned_at=new Date(x.scanned_at).toISOString();const r=await fetch('/api/external-reports',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(x)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed ('+r.status+')');msg.textContent='Saved. Refresh Player History for this Discord ID to see the staff-submitted report.';}catch(err){msg.textContent='Could not save: '+err.message+' (requires admin access and SQL migration).';}finally{b.disabled=false;}});</script></body></html>
