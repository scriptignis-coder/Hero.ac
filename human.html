<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Just a moment… · HeRo Shield</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#000;color:#f2f4f7;font:400 15px/1.6 system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
  main{width:min(620px,100% - 32px);margin:0 auto;padding:18vh 0 40px}
  .host{display:flex;align-items:center;gap:12px;font-size:clamp(26px,5vw,36px);font-weight:700;letter-spacing:-.02em}
  .host img{width:40px;height:40px;border-radius:9px}
  h1{margin-top:10px;font-size:clamp(18px,3.4vw,22px);font-weight:600}
  p{margin-top:10px;color:#a6abb4}
  .box{margin-top:28px;min-height:70px}
  .msg{margin-top:14px;font-size:14px;color:#a6abb4;min-height:22px}
  .msg.ok{color:#3ee08a}.msg.err{color:#ff7a8a}
  footer{margin-top:56px;padding-top:14px;border-top:1px solid #1d1f24;color:#5e636d;font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
  noscript{display:block;margin-top:20px;color:#ffb54a}
</style>
<style id="heroshield-charcoal-v18">

/* HeRoShield Charcoal Edition — presentation-only overrides */
:root{--bg:#0d1014;--bg2:#101419;--bg-2:#101419;--card:#151a20;--card2:#191f26;--card-solid:#191f26;--line:rgba(181,199,215,.105);--line2:rgba(181,199,215,.17);--line-strong:rgba(130,170,204,.23);--text:#e8edf1;--muted:#a0aab4;--dim:#697681;--blue:#739fbe;--blue2:#b1cee2;--cyan:#739fbe;--violet:#739fbe;--blueglow:rgba(115,159,190,.12);--grad:linear-gradient(135deg,#789fb9,#a4bfce);--radius:18px;--r:18px}
body{background:radial-gradient(ellipse 75% 30% at 50% -6%,rgba(115,159,190,.095),transparent 75%),#0d1014!important;color:#e8edf1}
::selection{background:rgba(115,159,190,.26)}
.bg{background:radial-gradient(780px 380px at 50% -70px,rgba(120,161,188,.13),transparent 75%),linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px) 0 0/68px 68px,linear-gradient(90deg,rgba(255,255,255,.013) 1px,transparent 1px) 0 0/68px 68px,transparent!important}
.nav.solid,header, .topbar{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav.solid{background:rgba(12,15,19,.89)!important}
.btn,.btn-w,.btn-g,.btn-b,button{transition:background .22s,border-color .22s,box-shadow .22s,transform .22s}
.btn-b{background:#739fbe!important;color:#0c141b!important}
.btn-b:hover{box-shadow:0 8px 30px rgba(115,159,190,.18)!important}
.btn-w{background:#dce5eb!important;color:#12181e!important}
.btn-g{background:rgba(210,224,234,.035)!important;border-color:rgba(210,224,234,.16)!important}
.btn-g:hover{background:rgba(115,159,190,.10)!important;border-color:rgba(115,159,190,.40)!important}
.pill{background:rgba(115,159,190,.055)!important;border-color:rgba(115,159,190,.19)!important;color:#b8c8d4!important}
.brand b{color:#93b4cb!important}
input:focus,textarea:focus,select:focus{outline-color:#739fbe!important;box-shadow:0 0 0 3px rgba(115,159,190,.12)}
:where(.card,.panel,.stat,.feature,.feature-card,.glass,.metric,.tile){border-color:rgba(190,206,219,.11)!important}
:where(.card,.panel,.feature-card,.glass){box-shadow:0 12px 38px rgba(0,0,0,.12)}
:where(.card,.panel,.feature-card,.glass):hover{border-color:rgba(135,174,200,.23)!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#101419}::-webkit-scrollbar-thumb{background:#333d47;border-radius:12px;border:2px solid #101419}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<main>
  <div class="host"><img src="/assets/logo-neon-sm.jpg" alt="">__HOST__</div>
  <h1>Security check in progress</h1>
  <p>This site uses a security service to protect itself from malicious bots. This page is shown while we check that you are not a bot.</p>
  <div class="box">
    <div class="cf-turnstile" data-sitekey="__SITEKEY__" data-action="site_gate" data-theme="dark" data-callback="hsDone" data-error-callback="hsErr" data-expired-callback="hsErr"></div>
  </div>
  <div class="msg" id="msg" role="status"></div>
  <noscript>Please enable JavaScript to continue.</noscript>
  <footer><span>Protected by Cloudflare Turnstile</span><span>·</span><span>HeRo Shield</span></footer>
</main>
<script>
  const msg = document.getElementById('msg');
  async function hsDone(token) {
    msg.className = 'msg'; msg.textContent = 'Verifying…';
    try {
      const r = await fetch('/api/human', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ 'cf-turnstile-response': token }), credentials: 'same-origin' });
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.code || d.error || ('HTTP ' + r.status)); }
      msg.className = 'msg ok'; msg.textContent = '✓ Verified — opening the site…';
      setTimeout(() => location.reload(), 350);
    } catch (e) {
      msg.className = 'msg err'; msg.textContent = 'Verification failed. Please try again.' + (e && e.message ? ' (' + e.message + ')' : '');
    }
  }
  function hsErr() { msg.className = 'msg err'; msg.textContent = 'The check could not finish. Reload the page to try again.'; }
</script>
</body>
</html>
